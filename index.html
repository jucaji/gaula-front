<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gaula Digital</title>
    <!--
      docs/06 §3.6: el tema se resuelve ANTES del primer pintado. Sin este
      script bloqueante, alguien trabajando de noche ve un destello blanco
      en cada recarga -- en una sala oscura eso no es un detalle estético.
      La densidad (docs/06 §5) se aplica en el mismo script para evitar un
      salto de layout (filas/controles cambiando de alto) justo después
      del primer pintado.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('gaula-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          /* localStorage inaccesible (modo privado estricto) -- se sigue el sistema */
        }
        try {
          var density = localStorage.getItem('gaula-density');
          if (density === 'compact' || density === 'default' || density === 'comfortable') {
            document.documentElement.setAttribute('data-density', density);
          }
        } catch (e) {
          /* localStorage inaccesible -- se usa el default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
